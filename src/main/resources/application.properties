spring.application.name=mathnova
spring.main.web-application-type=none
spring.main.banner-mode=off

# SQLite: un archivo en la carpeta del usuario (RNF17)
spring.datasource.url=jdbc:sqlite:${user.home}/.mathnova/mathnova.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# El esquema lo crea Flyway; Hibernate solo valida
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# RNF19: versión del motor que se guarda con cada resolución (RN25)
mathnova.version-motor=0.2.0

# Pestaña "Escribir": "unimernet" (UniMERNet Small local, solo CPU), "simulado" (ReconocedorSimulado, pruebas)
# o "sin-conexion" (sin motor). La carpeta del reconocedor se busca junto al .exe o en ./reconocedor;
# mathnova.unimernet.carpeta la fija. mathnova.escritura.pausa-ms: pausa sin escribir antes de reconocer.
mathnova.reconocedor=unimernet
mathnova.escritura.pausa-ms=700
